<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Finished</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="end.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="end-container">

<div class="end-card">

<i id="rankIcon" class="fa-solid fa-star"></i>

<h1>Congratulations!</h1>

<p>Your Quiz Has Finished</p>

<h2 id="finalScore">0</h2>

<div class="stats">

<div>

<h3>Correct</h3>

<p id="correct">0 / 10</p>

</div>

<div>

<h3>Time</h3>

<p id="time">0 s</p>

</div>

</div>

<div class="badge-box">

<span id="badge">
Beginner
</span>

</div>

<input
type="text"
id="username"
maxlength="20"
placeholder="Enter Your Name"
/>

<button id="saveScoreBtn">

<i class="fa-solid fa-floppy-disk"></i>

Save Score

</button>

<a href="highscores.html">

<i class="fa-solid fa-trophy"></i>

Leaderboard

</a>

<a href="index.html">

<i class="fa-solid fa-house"></i>

Home

</a>

</div>

</div>

<script src="end.js"></script>

</body>

</html>
